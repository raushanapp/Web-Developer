<!doctype html>
<html lang="en">

    <title>Understanding React</title>
  </head>
  <body>
    <main id="app"></main>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" data-type="module">
      // React Component with JSX
      (async () => {
        // Dynamic imports for React 19
        const React = await import("https://esm.sh/react@19/?dev");
        const ReactDOM = await import("https://esm.sh/react-dom@19/client?dev");

        const { useState, use, Suspense } = React.default;
        const { createRoot } = ReactDOM.default;
        // Instead of a separate app.js file, put all your app code here
        // Note this isn't how you would do this in production, but useful for leraning

        // function App() {
        //   return null; // app code here
        // }

        function Counter({ name, ref }) {
          const [numOfClicks, setNumOfClicks] = React.useState({ total: 0 });

          function handleClick() {
            setNumOfClicks({ ...numOfClicks, total: numOfClicks.total + 1 });
          }

          return (
            <article>
              <h2>Counter {name}</h2>
              <p>You clicks {numOfClicks.total} times</p>
              <p>
                <button
                  className="button"
                  onClick={handleClick}
                  ref={buttonRef}
                >
                  Click me
                </button>
              </p>
            </article>
          );
        }

        function App() {
          const ref = React.useRef();
          React.useEffect(() => {
            ref.current.focus();
          }, []);

          return (
            <>
              <h1>Counters</h1>
              <section>
                <Counter name="One" />
                <Counter name="Two" ref={ref} />
              </section>
            </>
          );
        }

        //  Ensure DOM is ready, then render
        const rootElement = document.getElementById("app");
        const root = createRoot(rootElement);
        root.render(<App />);
      })();
    </script>
  </body>
</html>
